<div class="auth-page">
    <div class="auth-card">
  
      <h1>Welcome Back</h1>
  
      <p class="auth-subtitle">
        Login to your account
      </p>
  
      @if (error) {
        <div class="error-message">
          {{ error }}
        </div>
      }
  
      <form (ngSubmit)="login()">
  
        <div class="form-group">
          <label for="email">
            Email
          </label>
  
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>
  
        <div class="form-group">
          <label for="password">
            Password
          </label>
  
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>
  
        <button
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
  
      </form>
  
      <div class="auth-footer">
        <span>Don't have an account?</span>
  
        <button
          type="button"
          class="link-button"
          (click)="goToRegister()"
        >
          Create an account
        </button>
      </div>
  
    </div>
  </div>

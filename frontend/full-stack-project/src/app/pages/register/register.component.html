<div class="auth-page">
    <div class="auth-card">
  
      <h1>Create Account</h1>
  
      <p class="auth-subtitle">
        Create your FullStackProject account
      </p>
  
      @if (error) {
        <div class="error-message">
          {{ error }}
        </div>
      }
  
      <form (ngSubmit)="register()">
  
        <div class="form-group">
          <label for="firstName">
            First Name
          </label>
  
          <input
            id="firstName"
            type="text"
            name="firstName"
            [(ngModel)]="firstName"
            placeholder="Enter your first name"
            autocomplete="given-name"
          />
        </div>
  
        <div class="form-group">
          <label for="lastName">
            Last Name
          </label>
  
          <input
            id="lastName"
            type="text"
            name="lastName"
            [(ngModel)]="lastName"
            placeholder="Enter your last name"
            autocomplete="family-name"
          />
        </div>
  
        <div class="form-group">
          <label for="email">
            Email
          </label>
  
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>
  
        <div class="form-group">
          <label for="password">
            Password
          </label>
  
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
          />
        </div>
  
        <button
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'Creating account...' : 'Register' }}
        </button>
  
      </form>
  
      <div class="auth-footer">
        <span>Already have an account?</span>
  
        <button
          type="button"
          class="link-button"
          (click)="goToLogin()"
        >
          Login
        </button>
      </div>
  
    </div>
  </div>

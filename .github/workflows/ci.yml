
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore backend/FullStackProject.sln

      - name: Build solution
        run: dotnet build backend/FullStackProject.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend/FullStackProject.Application.Tests/FullStackProject.Application.Tests.csproj --configuration Release --no-build

  frontend:
    name: Test and build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/full-stack-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/full-stack-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular production bundle
        run: npm run build
